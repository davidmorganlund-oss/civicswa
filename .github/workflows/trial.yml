name: Trial sources
on:
  workflow_dispatch:
    inputs:
      file:
        description: YAML with a sources list
        default: tools/candidates.yml
jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python tools/trial.py "${{ inputs.file }}"
