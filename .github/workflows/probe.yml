name: Probe sites
on:
  workflow_dispatch:
    inputs:
      list:
        description: TSV of name, county, homepage
        default: tools/cities.tsv
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - if: inputs.list == 'schools'
        run: python tools/ospi.py tools/schools.tsv && cat tools/schools.tsv | sed 's/^/SCHOOLROW /'
      - run: python tools/probe.py "${{ inputs.list == 'schools' && 'tools/schools.tsv' || inputs.list }}" probe.json
      - run: python -c "import json;[print('PROBE', json.dumps(r)) for r in json.load(open('probe.json'))]"
