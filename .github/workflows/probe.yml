name: Probe sites
on:
  workflow_dispatch:
    inputs:
      list:
        description: TSV of name, county, homepage
        default: tools/cities.tsv
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/probe.py "${{ inputs.list }}" probe.json
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe.json }
