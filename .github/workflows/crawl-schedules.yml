# Temporary: runs on pushes to crawl-* branches to find meeting sources for
# bodies with no feed. Not part of the site build.
name: Crawl schedules
on:
  push:
    branches: ["crawl-*"]
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [render2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run
        env:
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = "render2" ]; then
            pip install playwright==1.65.2 && python -m playwright install --with-deps chromium
            python tools/render_crawl.py tools/gap-schools2.tsv
          else
            python tools/gap_trial.py tools/gap-candidates2.yml
          fi
