name: Refresh and publish

on:
  schedule:
    - cron: "17 11 * * *"   # nightly, about 3:17 or 4:17 a.m. Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "README.md", "tools/**", ".github/workflows/probe.yml", ".github/workflows/trial.yml"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Build the calendar data
        run: python pipeline/build.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Build the representatives roster
        run: python pipeline/officials.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Flag calendars that keep failing
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/alerts.py
      - name: Save the refreshed data
        if: always()
        run: |
          git config user.name "civicswa-bot"
          git config user.email "civicswa-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Refresh calendar data"
          # Someone may have pushed while this ran; data files are ours, so rebase onto theirs.
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
