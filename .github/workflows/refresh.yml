name: Refresh and publish

on:
  schedule:
    - cron: "17 11 * * *"   # nightly, about 3:17 or 4:17 a.m. Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "README.md", "tools/**", ".github/workflows/probe.yml", ".github/workflows/trial.yml"]

# Each job gets only the access it needs (below); nothing by default.
permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

# Name the shell so a step fails when any command in a pipe fails. Without
# this, "python build.py | tee ..." reports success even if build.py crashed.
defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The build reads sources in parallel and usually takes a few minutes;
    # the limit is generous so a few slow websites can't stop a night's update.
    timeout-minutes: 30
    permissions:
      contents: write   # save the refreshed data
      issues: write     # open the "sources need attention" issue
    steps:
      # Actions are pinned to exact versions (the comment names the release),
      # so a change upstream can't alter what runs with write access here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Build the calendar data
        run: python pipeline/build.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Build the representatives roster
        run: python pipeline/officials.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Flag calendars that keep failing
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/alerts.py
      - name: Save the refreshed data
        if: always()
        run: |
          git config user.name "civicswa-bot"
          git config user.email "civicswa-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Refresh calendar data"
          # Someone may have pushed while this ran; data files are ours, so rebase onto theirs.
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
