# CivicsWA pilot sources: Thurston County, WA.
# Each source names a connector type and the public feed it reads.
# "area" is what the site matches a visitor's city or ZIP against;
# "countywide" sources show for everyone in the county.

window_days: 60
timezone: America/Los_Angeles

sources:
  - id: olympia
    name: City of Olympia
    type: legistar
    client: olympia
    area: Olympia
    homepage: https://olympia.legistar.com/Calendar.aspx

  - id: lacey
    name: City of Lacey
    type: civicclerk
    tenant: laceywa
    area: Lacey
    homepage: https://laceywa.portal.civicclerk.com/

  - id: thurston-county
    name: Thurston County
    type: ics
    url: https://outlook.office365.com/owa/calendar/37be4328991e4674ac13e314c7275ee2@co.thurston.wa.us/9dc269f43ccb4c5cb935e2a5c4456c2c17500354631400643582/calendar.ics
    area: countywide
    homepage: https://www.thurstoncountywa.gov/meetings-and-agendas

  - id: tumwater
    name: City of Tumwater
    type: municode
    url: https://tumwater-wa.municodemeetings.com/
    area: Tumwater
    homepage: https://tumwater-wa.municodemeetings.com/

  - id: port-of-olympia
    name: Port of Olympia
    type: mec_rss
    url: https://portolympia.com/events/feed/
    area: countywide
    default_location: Percival Plaza, Olympics Room, 626 Columbia St NW, Suite 1-B, Olympia
    default_location_marker: Olympics Room
    homepage: https://portolympia.com/commission/

  # Library programs are filtered to civic ones (board meetings, hearings,
  # Friends of the Library meetings, and titles about voting, government and
  # the like). Storytimes and classes are left out.
  - id: timberland-library
    name: Timberland Regional Library
    type: bibliocommons
    library: timberland
    locations: [OL, WO, LA, HA, TU, TE, YE]   # the Thurston County branches
    searches: [trustees]                       # the library board meets across the region
    city_areas: {Olympia: Olympia, Lacey: Lacey, Tumwater: Tumwater}
    area: countywide
    homepage: https://timberland.bibliocommons.com/v2/events

# Not connected yet:
#   City of Tumwater (tumwater-wa.municodemeetings.com). It offers no working
#   feed (its RSS is empty) and its server drops connections from automated
#   clients, so the "municode" connector in build.py is ready but unused.
#   Ask the city for a feed or for the nightly reader to be allowed.
#   School boards. Olympia School District posts agendas on BoardDocs, which
#   tells all automated clients to stay out, and lists its meeting dates as
#   plain text on osd.wednet.edu/board-meeting-schedule without times.
#   North Thurston and Tumwater school districts are not inventoried yet.
