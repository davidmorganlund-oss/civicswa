#   Clark County, WA. The Legistar account named "clark" turned out to be
#   Clark County, Nevada, so it was removed. Clark County, WA posts meetings
#   on clark.wa.gov without a feed.
#   Shoreline (govAccess calendar feed) and Everett (CivicPlus calendar) both
#   refuse requests from GitHub's servers (HTTP 403), so they are left out
#   rather than worked around.
#   Tumwater's separate meetings portal (tumwater-wa.municodemeetings.com) has
#   agendas, but its server refuses automated readers, so it is not used.
#   School boards on BoardDocs only: BoardDocs tells all automated clients to
#   stay out, so these districts are not read there. Olympia and Everett are
#   covered from their own district sites instead. Still without a source:
#   Northshore, Puyallup, Federal Way, Edmonds and Kent.
